apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
      - name: payment
        image: busybox
        command: ["sh", "-c", "echo Starting && sleep 5 && exit 1"]
        resources:
          limits:
            memory: "64Mi"
            cpu: "100m"